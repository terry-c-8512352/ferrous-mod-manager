name: Release

# Push a version tag to cut a release, e.g.:
#   git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags:
      - "v*"

# No workflow-level permissions: each job declares only what it needs.
permissions: {}

jobs:
  build:
    name: Build (${{ matrix.platform }})
    # Needed by tauri-action and `gh release upload` to create/edit the
    # GitHub Release. Scoped to this job rather than the whole workflow.
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-latest
          - platform: windows-latest
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # Tauri v2 needs the WebKitGTK/GLib stack at build time on Linux.
      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20

      # Pinned to a commit, so the toolchain must be given explicitly (the
      # action can no longer infer it from an @stable ref).
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: ${{ matrix.platform }}

      # Frontend deps for the tauri beforeBuildCommand (`cd ../ui && npm run build`).
      - name: Install frontend dependencies
        run: npm --prefix ui ci

      # `cargo tauri build --no-bundle` needs the Tauri v2 CLI; install it from npm.
      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli@^2

      # Builds the app and uploads the platform bundles (.deb/.rpm/.AppImage on
      # Linux, .msi/.exe on Windows) to a single draft GitHub Release. Each
      # matrix job appends its artifacts to the same release keyed by the tag.
      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Ferrous Mod Manager ${{ github.ref_name }}"
          # Leave as a draft so a human reviews + clicks Publish.
          releaseDraft: true
          generateReleaseNotes: true

      # Also attach a standalone, unbundled binary alongside the installers.
      # The release-mode artifacts are already compiled by the step above, so
      # this just relinks/renames the binary to the productName — it's cheap.
      - name: Build no-bundle binary
        run: tauri build --no-bundle

      # Upload the raw executable to the same draft release (Linux/macOS).
      - name: Attach standalone binary (Unix)
        if: matrix.platform != 'windows-latest'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Tag names may contain shell metacharacters; pass via env, never
          # interpolate ${{ github.ref_name }} into the script body.
          TAG_NAME: ${{ github.ref_name }}
          RUNNER_OS: ${{ runner.os }}
        run: |
          # Workspace target dir lives at the repo root, not under src-tauri/.
          # tauri build renames the cargo bin (app) to productName; fall back to
          # the raw cargo bin name in case that rename doesn't happen.
          bin=target/release/ferrous-mod-manager
          [ -f "$bin" ] || bin=target/release/app
          cp "$bin" "ferrous-mod-manager-${RUNNER_OS}-x86_64"
          gh release upload "$TAG_NAME" \
            "ferrous-mod-manager-${RUNNER_OS}-x86_64" --clobber

      # Upload the raw executable to the same draft release (Windows).
      - name: Attach standalone binary (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Tag names may contain shell metacharacters; pass via env, never
          # interpolate ${{ github.ref_name }} into the script body.
          TAG_NAME: ${{ github.ref_name }}
        run: |
          # Workspace target dir lives at the repo root, not under src-tauri/.
          $bin = "target/release/ferrous-mod-manager.exe"
          if (-not (Test-Path $bin)) { $bin = "target/release/app.exe" }
          Copy-Item $bin ferrous-mod-manager-Windows-x86_64.exe
          gh release upload "$env:TAG_NAME" `
            ferrous-mod-manager-Windows-x86_64.exe --clobber
